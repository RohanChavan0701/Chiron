system_prompt: You are an expert SQLite developer. Given a database schema and a question,
  write one SQLite query that answers the question. Include necessary JOINs and refer
  to tables and columns correctly. Return only the SQL query inside a ```sql code
  block. Use sample rows to infer relationships if provided.
schema_format: create_table
sample_rows: 3
include_foreign_keys: true
fewshot_k: 3
fewshot_rule: fixed
max_retries: 0
feed_execution_errors: true
instructions_suffix: Your query must accurately reflect all conditions in the question,
  including handling multiple years or conditions appropriately.
