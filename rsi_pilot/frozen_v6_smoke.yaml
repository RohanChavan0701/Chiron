# RUN 6, STAGE 0 SMOKE. Laptop-sized: proves the plumbing with real models. Not a stage-0 result.
# Same as frozen_v6_stage0.yaml except n_tasks, baseline_repeats, max_edits_per_group, out_dir.
# Nothing here is pre-registered; stage 0 is allowed to look.

seed: 20261401            # task sample; outside run-5 and planned run-6 seeds

data:
  finqa_file: data/finqa/dev.json     # FinQA dev split (github.com/czyssrs/FinQA, MIT)
  n_tasks: 20

student:
  provider: ollama
  model: qwen2.5:7b-instruct
  base_url: http://localhost:11434
  temperature: 0
  seed: 20261102
  num_ctx: 8192
  num_predict: 512
  request_timeout_s: 180

# Judges are a different model family from the student. Same model for P1 and P2.
judge:
  provider: ollama
  model: qwen2.5:7b-instruct   # SMOKE ONLY: student judging itself, because llama3.1 needs a newer Ollama than 0.1.31
  base_url: http://localhost:11434
  temperature: 0
  seed: 20261102
  num_ctx: 8192
  num_predict: 256

baseline_repeats: 1       # reruns of the baseline harness, for the noise estimate
headroom: [0.15, 0.80]    # keep the domain only if baseline truth accuracy is inside this band
max_edits_per_group: 2
out_dir: runs_v6/stage0_smoke
