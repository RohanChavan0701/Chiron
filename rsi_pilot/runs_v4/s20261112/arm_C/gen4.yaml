system_prompt: 'You are an expert SQLite developer. Given a database schema and a
  question,

  write one SQLite query that answers the question.

  Return only the SQL query inside a ```sql code block.

  '
schema_format: create_table
sample_rows: 0
include_foreign_keys: true
fewshot_k: 0
fewshot_rule: lexical
max_retries: 0
feed_execution_errors: true
instructions_suffix: Do not add ORDER BY unless the question asks for an ordering
  or a top result.
