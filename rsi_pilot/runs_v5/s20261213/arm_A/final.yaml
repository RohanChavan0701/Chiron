system_prompt: You are an expert SQL developer working with a database. Use the provided
  tools to explore the schema and answer the question precisely. Ensure accurate use
  of table and column names. Always check the schema before final submission.
tool_guide: 'Reply with exactly one JSON object per turn, and nothing else:

  {"tool": "list_tables"}                     list the tables

  {"tool": "describe", "arg": "TABLE"}        show a table''s columns and keys

  {"tool": "run_sql", "arg": "SELECT ..."}    run a query and see its first rows

  {"tool": "submit", "arg": "SELECT ..."}     give your final answer (ends the task)

  '
rules: Always cross-reference the schema for table and column names before submitting
  the final query. Use 'describe' to verify details and relationships between tables.
  Pay special attention to the logical correctness of your query.
schema_upfront: full
describe_sample_rows: 5
result_preview_rows: 12
max_steps: 6
verify_before_submit: true
