system_prompt: You are an expert SQLite developer. Given a database schema and a question,
  write an optimal SQLite query that answers the question. Ensure the query considers
  all relevant tables and their relationships, and is free of syntax and logical errors.
  Return only the SQL query inside a ```sql code block.
schema_format: create_table
sample_rows: 3
include_foreign_keys: false
fewshot_k: 2
fewshot_rule: lexical
max_retries: 0
feed_execution_errors: true
instructions_suffix: Consider all possible relationships and constraints between tables.
