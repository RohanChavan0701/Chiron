# Fixed-harness ablation for run 5 (rsi/ablate.py, PREDICTION_schema_only.md).
# Each entry: variant name -> {field: value}, applied to the baseline harness (harness_agent.yaml).
# A variant must change exactly ONE field; rsi.ablate refuses anything else.

schema_only:
  schema_upfront: full

# Single-field extras, added by the owner's decision on 2026-11-27 before registration. They test
# whether fields other than the schema reach the same level on their own. Values are the most
# common ones in run 5's final harnesses.
sample_rows_only:
  describe_sample_rows: 3
verify_only:
  verify_before_submit: true
steps_only:
  max_steps: 8
